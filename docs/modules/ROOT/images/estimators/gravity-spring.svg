<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Redrawn after Groves, "Principles of GNSS, Inertial, and Multisensor Integrated Navigation Systems", Fig. 2.17 -->

  <!-- Left panel: Freefall -->
  <g transform="translate(120,0)">
    <line x1="-40" y1="20" x2="40" y2="20" stroke="#333333" stroke-width="3"/>
    <!-- relaxed spring (short) -->
    <path d="M0,20 L0,35 L-12,42 L12,52 L-12,62 L12,72 L0,79 L0,95" fill="none" stroke="#333333" stroke-width="2"/>
    <!-- mass -->
    <rect x="-25" y="95" width="50" height="34" fill="none" stroke="#333333" stroke-width="2"/>
    <text x="-10" y="117" font-size="13" fill="#333333">m</text>

    <!-- gravitational force arrow -->
    <line x1="0" y1="129" x2="0" y2="180" stroke="#c0392b" stroke-width="2"/>
    <polygon points="0,180 -8,164 8,164" fill="#c0392b"/>
    <text x="10" y="175" font-size="12" fill="#c0392b" font-style="italic">m gamma</text>

    <text x="-45" y="215" font-size="14" fill="#333333">Freefall</text>
    <text x="-45" y="233" font-size="13" fill="#555555" font-style="italic">f = 0</text>
  </g>

  <!-- Right panel: Stationary -->
  <g transform="translate(380,0)">
    <line x1="-40" y1="20" x2="40" y2="20" stroke="#333333" stroke-width="3"/>
    <!-- stretched spring (long) -->
    <path d="M0,20 L0,32 L-12,40 L12,52 L-12,64 L12,76 L-12,88 L12,100 L0,108 L0,120" fill="none" stroke="#333333" stroke-width="2"/>
    <!-- mass -->
    <rect x="-25" y="120" width="50" height="34" fill="none" stroke="#333333" stroke-width="2"/>
    <text x="-10" y="142" font-size="13" fill="#333333">m</text>

    <!-- nongravitational spring force, upward, exerted by spring on mass -->
    <line x1="0" y1="120" x2="0" y2="80" stroke="#2980b9" stroke-width="2"/>
    <polygon points="0,80 -8,96 8,96" fill="#2980b9"/>
    <text x="10" y="90" font-size="12" fill="#2980b9" font-style="italic">nongravitational force</text>
    <text x="10" y="104" font-size="11" fill="#2980b9">(exerted by spring on mass)</text>

    <!-- gravitational force arrow -->
    <line x1="0" y1="154" x2="0" y2="205" stroke="#c0392b" stroke-width="2"/>
    <polygon points="0,205 -8,189 8,189" fill="#c0392b"/>
    <text x="10" y="200" font-size="12" fill="#c0392b" font-style="italic">m gamma</text>

    <text x="-55" y="240" font-size="14" fill="#333333">Stationary</text>
    <text x="-55" y="258" font-size="13" fill="#555555" font-style="italic">f = m gamma</text>
  </g>

  <text x="30" y="285" font-size="13" fill="#555555">Specific force f is what the accelerometer senses: zero in freefall, m*gamma when held stationary against gravity.</text>
</svg>
