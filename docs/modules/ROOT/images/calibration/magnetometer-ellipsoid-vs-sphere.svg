<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Left panel: measured ellipsoid (2-D cross-section) -->
  <g transform="translate(160,150)">
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#888888" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#888888" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="126" y="-6" font-size="12" fill="#888888">Bx</text>
    <text x="6" y="-98" font-size="12" fill="#888888">By</text>
    <circle cx="0" cy="0" r="3" fill="#888888"/>
    <text x="-30" y="16" font-size="12" fill="#888888">origin</text>

    <!-- ellipse centred at the hard iron bias, tilted by soft iron cross-coupling -->
    <g transform="translate(40,-22) rotate(-28)">
      <ellipse cx="0" cy="0" rx="100" ry="58" fill="none" stroke="#c0392b" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="100" y2="0" stroke="#c0392b" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="0" y2="-58" stroke="#c0392b" stroke-width="1.2"/>
    </g>
    <circle cx="40" cy="-22" r="4" fill="#c0392b"/>
    <line x1="0" y1="0" x2="36" y2="-20" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="50" y="-4" font-size="12" fill="#c0392b">b_m (hard iron)</text>
    <text x="-5" y="-84" font-size="11" fill="#c0392b" text-anchor="middle">semi-axes = |B|·σ_i(M)</text>
  </g>
  <text x="160" y="284" font-size="14" fill="#c0392b" text-anchor="middle">Measured readings: offset, tilted ellipsoid</text>

  <!-- Arrow: correction -->
  <line x1="290" y1="150" x2="350" y2="150" stroke="#555555" stroke-width="2"/>
  <polygon points="352,150 340,144 340,156" fill="#555555"/>
  <text x="320" y="136" font-size="12" fill="#888888" text-anchor="middle">M⁻¹(b − b_m)</text>

  <!-- Right panel: corrected sphere -->
  <g transform="translate(490,150)">
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#888888" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#888888" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="106" y="-6" font-size="12" fill="#888888">Bx</text>
    <text x="6" y="-98" font-size="12" fill="#888888">By</text>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#2471a3" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="3" fill="#2471a3"/>
    <line x1="0" y1="0" x2="57" y2="-57" stroke="#2471a3" stroke-width="1.2"/>
    <text x="32" y="-12" font-size="12" fill="#2471a3">|B_Earth|</text>
  </g>
  <text x="490" y="284" font-size="14" fill="#2471a3" text-anchor="middle">Corrected readings: centred sphere</text>
</svg>
