<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Ideal orthogonal sensitive axes -->
  <g transform="translate(150,170)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polygon points="100,0 88,-6 88,6" fill="#999999"/>
    <text x="106" y="4" font-size="13" fill="#999999">x (ideal)</text>

    <line x1="0" y1="0" x2="0" y2="-100" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polygon points="0,-100 -6,-88 6,-88" fill="#999999"/>
    <text x="6" y="-92" font-size="13" fill="#999999">y (ideal)</text>

    <!-- Actual, non-orthogonal, scaled sensitive axes -->
    <line x1="0" y1="0" x2="96" y2="18" stroke="#c0392b" stroke-width="2.5"/>
    <polygon points="96,18 82.7,23.7 85.7,7.9" fill="#c0392b"/>
    <text x="100" y="34" font-size="13" fill="#c0392b">actual x-axis</text>
    <text x="100" y="50" font-size="11" fill="#c0392b">(scale factor + misalignment)</text>

    <line x1="0" y1="0" x2="-24" y2="-92" stroke="#c0392b" stroke-width="2.5"/>
    <polygon points="-24,-92 -13.2,-82.4 -28.7,-78.4" fill="#c0392b"/>
    <text x="-96" y="-96" font-size="13" fill="#c0392b">actual y-axis</text>

    <!-- angle between ideal and actual x -->
    <path d="M 40 0 A 40 40 0 0 0 38.4 7.2" fill="none" stroke="#c0392b" stroke-width="1.2"/>
  </g>

  <!-- Bias offset -->
  <g transform="translate(380,170)">
    <circle cx="0" cy="0" r="4" fill="#333333"/>
    <text x="-10" y="20" font-size="13" fill="#333333">true origin</text>
    <line x1="0" y1="0" x2="60" y2="-40" stroke="#2980b9" stroke-width="2.5"/>
    <polygon points="60,-40 45,-38 52,-25" fill="#2980b9"/>
    <circle cx="60" cy="-40" r="4" fill="#2980b9"/>
    <text x="66" y="-42" font-size="13" fill="#2980b9">bias b</text>
    <text x="66" y="-26" font-size="11" fill="#2980b9">(reading at zero input)</text>
  </g>

  <text x="30" y="30" font-size="16" fill="#333333">Sensor error model</text>
  <text x="30" y="280" font-size="13" fill="#555555">measured = bias + (I + cross-coupling/scale-factor matrix) x true + noise</text>
  <text x="30" y="298" font-size="13" fill="#555555">Calibration estimates bias and the cross-coupling matrix so raw readings can be corrected back to "true".</text>
</svg>
